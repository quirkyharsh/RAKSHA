<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAKSHA - Your Safety Companion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
        background-color: #eaf7ff; /* Soft blue color */
        color: white;
        margin-top: 70px;
    }

        header {
            background-color: rgba(0, 0, 0, 0.8);
            padding: 15px;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: bold;
            color: white;
        }

        /* Button styling */
        .btn-primary {
            background-color: #55ca48 !important;
            border-color: #55ca48 !important;
        }

        .btn-outline-secondary {
            color: rgb(181, 17, 17);
            border-color: rgb(202, 13, 13);
        }

        .btn-outline-secondary:hover {
            background-color: rgb(203, 183, 183);
            color: #0072ff;
        }

        /* Container and image styling */
        .container {
            position: relative;
            padding-top: 125px;
        }

        /* Stable background image */
        .stable-image {
            width: 100%;
            height: auto;
            position: absolute;
            top: 100px;
            left: 0;
            z-index: 1;
            object-fit: cover;
        }

        /* Overlay buttons on top of the image */
        .overlay-buttons {
    position: absolute;
    top: 158%; /* Adjusted to move buttons down */
    left: 50%; /* Center horizontally */
    transform: translate(-50%, -50%); /* Center the buttons */
    z-index: 2;
    display: flex;
    gap: 80px;
}


        /* Ensure text stays above image */
        .container p {
            z-index: 3;
            position: relative;
        }

        /* Black Box Styling */
        .info-card {
            background-color: #000;
            border-radius: 15px;
            padding: 20px;
            color: white;
            margin-bottom: 30px;
        }

        .safety-image {
            width: 100%;
            height: auto;
            transform: translateY(100%);
            opacity: 0;
            transition: transform 1s ease-out, opacity 1s ease-out;
        }

        .image-pop {
            transform: translateY(0);
            opacity: 1;
        }

        /* Card styles */
        .card-section {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.5);
        }

        .flip-card {
            flex: 1;
            max-width: 300px;
            height: 400px;
            perspective: 1000px;
        }

        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }

        .flip-card:hover .flip-card-inner {
            transform: rotateY(180deg);
        }

        .flip-card-front,
        .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 10px;
        }

        .flip-card-front {
            background-color: #ff2828;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
        }

        .flip-card-back {
            background-color: #333;
            color: white;
            transform: rotateY(180deg);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
        }
    </style>
</head>

<body>
    <header class="d-flex flex-wrap align-items-center justify-content-between">
        <h1>RAKSHA</h1>
        <ul class="nav nav-pills">
            <li class="nav-item"><a href="{{ url_for('home') }}" class="nav-link active">Home</a></li>
            <li class="nav-item"><a href="{{ url_for('features') }}" class="nav-link">Features</a></li>
            <li class="nav-item"><a href="{{ url_for('pricing') }}" class="nav-link">Pricing</a></li>
            <li class="nav-item"><a href="{{ url_for('faq') }}" class="nav-link">FAQs</a></li>
            <li class="nav-item"><a href="{{ url_for('about') }}" class="nav-link">About</a></li>
        </ul>
    </header>

    <div class="container text-center">
        <!-- Stable background image -->
        <img src="{{ url_for('static', filename='images/background_magic.jpeg') }}" alt="Background Image" class="stable-image">

        <!-- Buttons overlaid on the image -->
        <div class="overlay-buttons">
            <a href="{{ url_for('login') }}" class="btn btn-primary btn-lg px-4">SAFETY MODE</a>
            <!-- SOS Button -->
<form action="{{ url_for('sos') }}" method="POST" class="d-inline">

</form>

        </div>
