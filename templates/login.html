<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAKSHA - Safety Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        body {
            background-image: url('https://source.unsplash.com/1600x900/?city,night');
            background-size: cover;
            background-repeat: no-repeat;
            font-family: 'Poppins', sans-serif;
            color: white;
            margin-top: 70px;
        }

        header {
            background-color: rgba(0, 0, 0, 0.8);
            padding: 15px;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 2rem;
            font-weight: 500;
        }

        ul.nav-pills {
            margin-right: 10px;
        }

        .form-signin {
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 15px;
            margin-top: 150px;
            backdrop-filter: blur(15px); /* Glassmorphism effect */
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .form-control {
            background-color: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            padding: 15px;
        }

        .form-control:focus {
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
            border-color: #00c6ff;
            box-shadow: 0 0 10px rgba(0, 198, 255, 0.5);
        }

        .btn-primary {
            background-color: #00c6ff;
            border-color: #00c6ff;
            font-weight: 500;
            border-radius: 50px;
            padding: 10px;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }

        .btn-primary:hover {
            background-color: #005ecb;
            transform: scale(1.05);
        }

        label {
            color: white;
            font-weight: 300;
        }

        h1.h3 {
            font-size: 1.75rem;
            font-weight: 500;
        }

        .form-floating {
            margin-bottom: 20px;
        }

        .form-signin p {
            text-align: center;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>
    <header class="d-flex flex-wrap align-items-center justify-content-between">
        <h1>RAKSHA</h1>
        <ul class="nav nav-pills">
            <li class="nav-item"><a href="{{ url_for('home') }}" class="nav-link active">Home</a></li>
            <li class="nav-item"><a href="{{ url_for('features') }}" class="nav-link">Features</a></li>
            <li class="nav-item"><a href="{{ url_for('pricing') }}" class="nav-link">Pricing</a></li>
            <li class="nav-item"><a href="{{ url_for('faq') }}" class="nav-link">FAQs</a></li>
            <li class="nav-item"><a href="{{ url_for('about') }}" class="nav-link">About</a></li>
        </ul>
    </header>
    <p>&nbsp;</p>
    <p>&nbsp;</p>
    <main class="form-signin w-100 m-auto">
        <form action="{{ url_for('login') }}" method="POST">
            <h1 class="h3 mb-3 fw-normal text-center">Enter Your Information</h1>

            <div class="form-floating mb-3">
                <input type="text" name="name" class="form-control" id="floatingName" required>
                <label for="floatingName">Name</label>
            </div>

            <div class="form-floating mb-3">
                <input type="tel" name="user_phone_no" class="form-control" id="floatingUserPhone" required>
                <label for="floatingUserPhone">Your Phone Number</label>
            </div>

            <div class="form-floating mb-3">
                <input type="tel" name="emergency_no" class="form-control" id="floatingEmergencyPhone" required>
                <label for="floatingEmergencyPhone">Emergency Number</label>
            </div>

            <button class="btn btn-primary w-100 py-2" type="submit">Activate Safety Mode</button>
            <p class="mt-5 mb-3 text-body-secondary">© 2024 Company, Inc. All rights reserved.</p>
        </form>
    </main>
</body>

</html>
